dependencies:
  # Pinned exactly, so a new release never moves every checkout at once on the
  # next `pantry install`. The framework needs 1.4 to install (it depends on
  # packages published as pantry URLs, which 1.3 cannot resolve), and 1.4
  # writes bun.lock as `lockfileVersion: 2`: move this pin and regenerate the
  # lock in one commit.
  bun: 1.4.4
  git: ^2.53.0
  sqlite: ^3.53.4
