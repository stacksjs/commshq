name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@v0.11.28
        with:
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          # Exact key only. A prefix fallback restored an older tree, `bun install`
          # left its stale nested @stacksjs copies in place (it does not prune), and
          # the first job saved that under the new lock's key, so the build got an
          # exact hit on a tree the lock does not describe. v2 skips that entry.
          key: node-modules-v2-${{ hashFiles('**/bun.lock') }}

      - name: Install Dependencies
        run: bun install

      - name: Lint
        run: bun buddy lint

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@v0.11.28
        with:
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          # Exact key only. A prefix fallback restored an older tree, `bun install`
          # left its stale nested @stacksjs copies in place (it does not prune), and
          # the first job saved that under the new lock's key, so the build got an
          # exact hit on a tree the lock does not describe. v2 skips that entry.
          key: node-modules-v2-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Set Application Key
        run: bun buddy key:generate

      - name: Typecheck
        run: bun buddy test:types

      # tsc cannot see inside .stx, so the templates' script blocks and {{ }}
      # expressions are checked by stx's own checker. Through the package script
      # so the --lib list lives in one place. The checker exits 1 on errors but
      # 0 on warnings, so the summary line is the gate; `set -o pipefail` carries
      # an error exit through the tee. Same shape as the other five HQ apps'.
      - name: Typecheck views
        run: |
          set -o pipefail
          bun run typecheck:views | tee /tmp/stx-typecheck.log
          if ! grep -qE '0 error\(s\), 0 warning\(s\)' /tmp/stx-typecheck.log; then
            echo "::error::stx typecheck is not clean, see the log above"
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@v0.11.28
        with:
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          # Exact key only. A prefix fallback restored an older tree, `bun install`
          # left its stale nested @stacksjs copies in place (it does not prune), and
          # the first job saved that under the new lock's key, so the build got an
          # exact hit on a tree the lock does not describe. v2 skips that entry.
          key: node-modules-v2-${{ hashFiles('**/bun.lock') }}

      - name: Install Dependencies
        run: bun install

      - name: Set Application Key
        run: bun buddy key:generate

      # Feature tests query real tables, and a fresh checkout has no database
      # file at all: it is gitignored, being machine-local state. Without this
      # the suite fails in beforeAll with "no such table", which reads like a
      # broken test rather than a missing schema.
      - name: Migrate the database
        run: bun buddy migrate

      - name: Test Suite
        run: bun run test

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@v0.11.28
        with:
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          # Exact key only. A prefix fallback restored an older tree, `bun install`
          # left its stale nested @stacksjs copies in place (it does not prune), and
          # the first job saved that under the new lock's key, so the build got an
          # exact hit on a tree the lock does not describe. v2 skips that entry.
          key: node-modules-v2-${{ hashFiles('**/bun.lock') }}

      - name: Install Dependencies
        run: bun install

      - name: Build application
        run: bun run build

      - name: Build documentation
        run: bun buddy build docs

      - name: Validate documentation
        run: bun run docs:validate

      - name: Validate UI accessibility
        run: bun run ui:validate

      - name: Validate responsive visual contracts
        run: bun run visual:validate

      - name: Validate production release artifact
        run: bun run release:validate

      - name: Verify generated files are current
        run: git diff --exit-code
