name: Deploy

on:
  # Push to deploy: main is production. Manual runs stay available for a plan.
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan the production deployment without changing infrastructure
        required: true
        default: true
        type: boolean

concurrency:
  group: commshq-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@v0.11.28
        with:
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check encrypted production environment
        run: ./buddy env:check --file .env.production --strict
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}

      - name: Prepare deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "No deploy SSH key configured."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub

      - name: Deploy production
        run: |
          # A dry run only when a human asked for one. `inputs.dry_run` is empty
          # on a push event, and comparing an empty string is a silent way to
          # decide whether production gets deployed - so the event is checked
          # explicitly rather than inferred from a blank input.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ./buddy deploy --prod --dry-run --yes
          else
            ./buddy deploy --prod --yes
          fi
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
