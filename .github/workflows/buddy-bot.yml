name: Buddy Bot

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: buddy-bot
  cancel-in-progress: false

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pantry-pm/action@v0.11.28
        with:
          version: 0.11.28
          install: false
      - run: bun install --frozen-lockfile
      - name: Update dependencies
        run: bun x buddy-bot update --strategy patch --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.BUDDY_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Update dependency dashboard
        run: bun x buddy-bot dashboard --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.BUDDY_BOT_TOKEN || secrets.GITHUB_TOKEN }}
